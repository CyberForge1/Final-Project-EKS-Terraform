# Exposes Argo CD at https://argocd.digitalwitch.online (must match var.argocd_hostname).
# Apply MANUALLY only after the DNS CNAME "argocd" points at the NGINX load
# balancer (terraform output load_balancer_hostname) and resolves:
#   kubectl apply -f manifests/argocd-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # F5 NGINX rejects a second Ingress for the same host, so cert-manager
    # adds the ACME challenge path to this Ingress instead of creating its own
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.digitalwitch.online
      secretName: argocd-server-tls
  rules:
    - host: argocd.digitalwitch.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
