# Terraform CI/CD for the Final  Project EKS stack
# =============================================
name: terraform deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy everything instead of applying (needs the destroy job uncommented)"
        type: boolean
        default: false

permissions:
  id-token: write 
  contents: read

# Never run two Terraform jobs against the same state at once
concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------------------
  init:
    name: terraform init & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

